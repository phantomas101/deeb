{% extends "base.html" %}

{% block title %}إضافة فرع جديد{% endblock %}
{% block header %}إضافة فرع جديد{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-success text-white">
                <i class="fas fa-store"></i> بيانات الفرع الجديد
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('branches.add_branch') }}">
                    <div class="mb-3">
                        <label class="form-label">اسم الفرع <span class="text-danger">*</span></label>
                        <input type="text" name="name" class="form-control" placeholder="مثال: فرع مدينة نصر" required>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" name="is_main" class="form-check-input" id="isMain">
                        <label class="form-check-label" for="isMain">تعيين كفرع رئيسي (المخزن الرئيسي)</label>
                        <div class="text-muted small">الفرع الرئيسي هو المصدر الأساسي للبضاعة في التحويلات.</div>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('branches.index') }}" class="btn btn-secondary">إلغاء</a>
                        <button type="submit" class="btn btn-success">حفظ الفرع</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
