{% extends "base.html" %}

{% block title %}إضافة مصروف{% endblock %}
{% block header %}تسجيل مصروف جديد{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-danger text-white">
                <i class="fas fa-minus-circle"></i> صرف من الخزينة
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">فئة المصروف <span class="text-danger">*</span></label>
                        <select name="category" class="form-select" required>
                            <option value="">-- اختر الفئة --</option>
                            <option value="إيجار">إيجار</option>
                            <option value="رواتب">رواتب</option>
                            <option value="كهرباء">كهرباء</option>
                            <option value="مياه">مياه</option>
                            <option value="غاز">غاز</option>
                            <option value="مشتريات">مشتريات</option>
                            <option value="نثرية">نثرية</option>
                            <option value="أخرى">أخرى</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">المبلغ <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" name="amount" class="form-control" placeholder="مثال: 500" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">ملاحظات</label>
                        <textarea name="notes" class="form-control" rows="3" placeholder="أي تفاصيل إضافية..."></textarea>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('cash.index') }}" class="btn btn-secondary">إلغاء</a>
                        <button type="submit" class="btn btn-danger">تسجيل المصروف</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
