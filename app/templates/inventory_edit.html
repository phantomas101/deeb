{% extends "base.html" %}

{% block title %}تعديل المنتج{% endblock %}
{% block header %}تعديل بيانات المنتج{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-warning">
                <h5 class="mb-0"><i class="fas fa-edit"></i> تعديل: {{ product.name }}</h5>
            </div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">اسم المنتج <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">كود المنتج</label>
                            <input type="text" name="code" class="form-control" value="{{ product.code or '' }}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">الفئة</label>
                            <input type="text" name="category" class="form-control" value="{{ product.category }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">صورة المنتج</label>
                            <input type="file" name="image" class="form-control" accept="image/*">
                            <small class="text-muted">اتركه فارغاً للإبقاء على الصورة الحالية</small>
                            {% if product.image_filename %}
                                <div class="mt-2">
                                    <img src="{{ url_for('static', filename='uploads/products/' + product.image_filename) }}" style="max-height: 100px; border-radius: 8px;">
                                </div>
                            {% endif %}
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">سعر التكلفة</label>
                            <input type="number" step="0.01" name="cost_price" class="form-control" value="{{ product.cost_price }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">سعر البيع (قطاعي) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" name="selling_price" class="form-control" value="{{ product.selling_price }}" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">سعر الجملة</label>
                            <input type="number" step="0.01" name="wholesale_price" class="form-control" value="{{ product.wholesale_price }}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">الكمية المتاحة</label>
                            <input type="number" name="quantity" class="form-control" value="{{ product.quantity }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">الحد الأدنى للتنبيه</label>
                            <input type="number" name="min_stock" class="form-control" value="{{ product.min_stock }}">
                        </div>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('inventory.index') }}" class="btn btn-secondary">إلغاء</a>
                        <button type="submit" class="btn btn-primary">تحديث المنتج</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
