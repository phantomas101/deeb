{% extends "base.html" %}

{% block title %}إضافة منتج جديد{% endblock %}
{% block header %}إضافة منتج جديد{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-success text-white">
                <i class="fas fa-plus-circle"></i> بيانات المنتج الجديد
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('inventory.add_product') }}" enctype="multipart/form-data">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">اسم المنتج <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control" placeholder="مثال: Dell Latitude 7490 i5" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">كود المنتج</label>
                            <input type="text" name="code" class="form-control" placeholder="كود داخلي أو باركود">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">الفئة</label>
                            <input type="text" name="category" class="form-control" placeholder="أدخل الفئة">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">صورة المنتج</label>
                            <input type="file" name="image" class="form-control" accept="image/*">
                            <small class="text-muted">صور مسموحة: PNG, JPG, JPEG, GIF, WEBP</small>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">سعر التكلفة</label>
                            <input type="number" step="0.01" name="cost_price" class="form-control" placeholder="0.00">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">سعر البيع (قطاعي) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" name="selling_price" class="form-control" placeholder="0.00" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">سعر الجملة</label>
                            <input type="number" step="0.01" name="wholesale_price" class="form-control" placeholder="0.00">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">الكمية المتاحة</label>
                            <input type="number" name="quantity" class="form-control" placeholder="0" value="0">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">الحد الأدنى للتنبيه</label>
                            <input type="number" name="min_stock" class="form-control" placeholder="5" value="5">
                        </div>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('inventory.index') }}" class="btn btn-secondary">إلغاء</a>
                        <button type="submit" class="btn btn-success">حفظ المنتج</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
